[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opti"
version = "0.1.0"
description = "Multi-domain performance optimizer: constrained behavioral recommendations from a linear performance model."
requires-python = ">=3.10"
authors = [{ name = "OPTI" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
opti = "opti.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opti*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# N (pep8-naming) disabled: ML convention uses capital X for design matrices
# and W for weight matrices. Fighting that hurts readability for the audience.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B905"]  # zip() strict= in tests is unnecessary noise.

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
